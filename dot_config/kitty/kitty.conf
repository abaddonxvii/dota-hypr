# Font 
font_family JetBrainsMono Nerd Font 
bold_font auto 
italic_font auto 
font_size 12.0 
# Color 
background #000000
foreground #FFFFFF
bold_foreground #FFFFFF
selection_background #004F2A
selection_foreground #AEE9A0

cursor #AEE9A0
cursor_text_color #001A10
url_color #AEE9A0
active_border_color #AEE9A0
inactive_border_color #004F2A

allow_remote_control yes
listen_on unix:@mykitty

shell /usr/bin/zsh 

include ~/.cache/matugen/colors-kitty.conf 

shell_integration enabled
cursor_shape beam
